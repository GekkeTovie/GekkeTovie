<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GekkeTovie and TovieIT</title><desc id="desc">Dark technical profile banner with a readable systems dashboard.</desc>
