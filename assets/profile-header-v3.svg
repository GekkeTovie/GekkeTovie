  <g>
    <rect x="66" y="48" width="220" height="32" rx="16" fill="#0B1726" stroke="#24425B"/><circle cx="88" cy="64" r="5" fill="#22C55E"/><text x="103" y="69" fill="#D9E4F2" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">AVAILABLE FOR USEFUL PROBLEMS</text>
    <text x="66" y="139" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">GekkeTovie</text>
    <text x="66" y="190" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Build systems. Automate boring work.</text><text x="66" y="228" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Keep the useful bits running.</text>
    <text x="66" y="278" fill="#B9C7D8" font-family="Segoe UI, Arial, sans-serif" font-size="20">Web, AI workflows, custom tools, self-hosted infrastructure.</text><text x="66" y="308" fill="#B9C7D8" font-family="Segoe UI, Arial, sans-serif" font-size="20">One builder behind TovieIT. Zero mystery hand-off departments.</text>
    <rect x="66" y="337" width="142" height="34" rx="17" fill="#0B1726" stroke="#24425B"/><text x="91" y="359" fill="#8BE8FF" font-family="Consolas, monospace" font-size="15">TovieIT // NL</text>
    <rect x="220" y="337" width="240" height="34" rx="17" fill="#0B1726" stroke="#24425B"/><text x="242" y="359" fill="#9AF7B5" font-family="Consolas, monospace" font-size="15">BUILD / AUTOMATE / MAINTAIN</text>
  </g>
