<svg width="1280" height="310" viewBox="0 0 1280 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TovieIT build loop</title><desc id="desc">Four-step workflow from finding friction to maintaining the shipped system.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="310" gradientUnits="userSpaceOnUse"><stop stop-color="#07111D"/><stop offset="1" stop-color="#0A1725"/></linearGradient></defs><rect width="1280" height="310" rx="22" fill="url(#bg)"/>
  <text x="46" y="45" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">HOW WORK GETS SHIPPED</text><text x="1042" y="45" fill="#8296AB" font-family="Consolas, monospace" font-size="13">REPEAT WHEN REALITY CHANGES</text>
  <g stroke="#315267" stroke-width="3" stroke-linecap="round"><path d="M304 143H344"/><path d="M606 143H646"/><path d="M908 143H948"/></g><g fill="#38BDF8"><path d="M344 143L334 137V149L344 143Z"/><path d="M646 143L636 137V149L646 143Z"/><path d="M948 143L938 137V149L948 143Z"/></g>
  <g><rect x="42" y="76" width="262" height="134" rx="18" fill="#0D1E2D" stroke="#27506A"/><circle cx="75" cy="108" r="18" fill="#38BDF8"/><text x="63" y="114" fill="#03111D" font-family="Consolas, monospace" font-size="15" font-weight="800">01</text><text x="104" y="113" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">FIND THE FRICTION</text><text x="66" y="154" fill="#C5D2E0" font-family="Segoe UI, Arial, sans-serif" font-size="15">Understand the real problem.</text><text x="66" y="178" fill="#8EA2B7" font-family="Segoe UI, Arial, sans-serif" font-size="14">Not just the loudest symptom.</text></g>
  <g><rect x="344" y="76" width="262" height="134" rx="18" fill="#0D1E2D" stroke="#2C5D49"/><circle cx="377" cy="108" r="18" fill="#22C55E"/><text x="365" y="114" fill="#04140A" font-family="Consolas, monospace" font-size="15" font-weight="800">02</text><text x="406" y="113" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">BUILD THE USEFUL BIT</text><text x="368" y="154" fill="#C5D2E0" font-family="Segoe UI, Arial, sans-serif" font-size="15">Web, tools, integrations.</text><text x="368" y="178" fill="#8EA2B7" font-family="Segoe UI, Arial, sans-serif" font-size="14">Small enough to ship.</text></g>
  <g><rect x="646" y="76" width="262" height="134" rx="18" fill="#0D1E2D" stroke="#69552B"/><circle cx="679" cy="108" r="18" fill="#F59E0B"/><text x="667" y="114" fill="#211202" font-family="Consolas, monospace" font-size="15" font-weight="800">03</text><text x="708" y="113" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">AUTOMATE THE BORING</text><text x="670" y="154" fill="#C5D2E0" font-family="Segoe UI, Arial, sans-serif" font-size="15">AI workflows, repeatable ops.</text><text x="670" y="178" fill="#8EA2B7" font-family="Segoe UI, Arial, sans-serif" font-size="14">Humans keep the interesting part.</text></g>
  <g><rect x="948" y="76" width="290" height="134" rx="18" fill="#0D1E2D" stroke="#3B5E6B"/><circle cx="981" cy="108" r="18" fill="#67E8F9"/><text x="969" y="114" fill="#03151A" font-family="Consolas, monospace" font-size="15" font-weight="800">04</text><text x="1010" y="113" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">KEEP IT ALIVE</text><text x="972" y="154" fill="#C5D2E0" font-family="Segoe UI, Arial, sans-serif" font-size="15">Deploy, monitor, maintain.</text><text x="972" y="178" fill="#8EA2B7" font-family="Segoe UI, Arial, sans-serif" font-size="14">Reality gets the final code review.</text></g>
  <path d="M1120 221C1120 267 1040 267 1000 267H270C220 267 160 261 160 221" stroke="#25475B" stroke-width="2" stroke-dasharray="7 7"/><path d="M160 221L154 233H166L160 221Z" fill="#22C55E"/>
