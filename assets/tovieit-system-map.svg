<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TovieIT service tree</title>
  <desc id="desc">A forest-themed terminal tree of TovieIT public capabilities.</desc>
  <rect width="1280" height="300" rx="8" fill="#0E140F"/>
  <rect x="24" y="22" width="1232" height="256" rx="6" fill="#111813" stroke="#2D3E30" stroke-width="2"/>
  <rect x="24" y="22" width="1232" height="36" rx="6" fill="#161F18"/>
  <rect x="24" y="52" width="1232" height="6" fill="#161F18"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="47" cy="40" r="4" fill="#6F806F"/><circle cx="63" cy="40" r="4" fill="#8B7953"/><circle cx="79" cy="40" r="4" fill="#7FA66F"/>
    <text x="98" y="45" fill="#7F9080" font-size="12">tovieit@server: ~/services</text>
    <text x="52" y="91" fill="#9BCF80" font-size="15">$ tree ./services -L 2</text>

    <text x="52" y="128" fill="#E5EBE2" font-size="17" font-weight="700">services</text>
    <text x="52" y="158" fill="#A9B6A7" font-size="15">&#9500;&#9472;&#9472; build/</text>
    <text x="52" y="184" fill="#768B78" font-size="14">&#9474;   &#9500;&#9472;&#9472; web_and_apps</text>
    <text x="52" y="210" fill="#768B78" font-size="14">&#9474;   &#9492;&#9472;&#9472; custom_tools</text>

    <text x="356" y="158" fill="#A9B6A7" font-size="15">&#9500;&#9472;&#9472; automate/</text>
    <text x="356" y="184" fill="#768B78" font-size="14">&#9474;   &#9500;&#9472;&#9472; ai_workflows</text>
    <text x="356" y="210" fill="#768B78" font-size="14">&#9474;   &#9492;&#9472;&#9472; repeatable_ops</text>

    <text x="690" y="158" fill="#A9B6A7" font-size="15">&#9492;&#9472;&#9472; maintain/</text>
    <text x="690" y="184" fill="#768B78" font-size="14">    &#9500;&#9472;&#9472; self_hosting</text>
    <text x="690" y="210" fill="#768B78" font-size="14">    &#9492;&#9472;&#9472; support_and_repair</text>

    <rect x="1008" y="94" width="204" height="128" rx="5" fill="#0D130E" stroke="#344938"/>
    <text x="1032" y="126" fill="#78977B" font-size="13">pipeline.status</text>
    <text x="1032" y="158" fill="#D6E1D3" font-size="14">build      <tspan fill="#9BCF80">[ok]</tspan></text>
    <text x="1032" y="184" fill="#D6E1D3" font-size="14">automate   <tspan fill="#9BCF80">[ok]</tspan></text>
    <text x="1032" y="210" fill="#D6E1D3" font-size="14">maintain   <tspan fill="#9BCF80">[ok]</tspan></text>

    <text x="52" y="250" fill="#6F806F" font-size="13">6 directories  //  one technical partner  //  direct support</text>
    <rect x="698" y="238" width="8" height="14" fill="#9BCF80" opacity="0.85"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="298.5" rx="7.25" stroke="#263429" stroke-width="1.5"/>
</svg>

