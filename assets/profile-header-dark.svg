    <circle cx="834" cy="288" r="6" fill="#22C55E"/>
    <circle cx="888" cy="252" r="6" fill="#4ADE80"/>
    <circle cx="928" cy="258" r="6" fill="#34D399"/>
    <circle cx="976" cy="212" r="6" fill="#2DD4BF"/>
    <circle cx="1034" cy="226" r="6" fill="#22D3EE"/>
    <circle cx="1094" cy="162" r="6" fill="#38BDF8"/>
    <circle cx="1148" cy="176" r="6" fill="#60A5FA"/>

    <rect x="814" y="322" width="112" height="18" rx="9" fill="#152234"/>
    <rect x="814" y="322" width="76" height="18" rx="9" fill="#22C55E"/>
    <text x="814" y="314" fill="#64748B" font-family="Consolas, monospace" font-size="12">deployments</text>

    <rect x="948" y="322" width="112" height="18" rx="9" fill="#152234"/>
    <rect x="948" y="322" width="90" height="18" rx="9" fill="#38BDF8"/>
    <text x="948" y="314" fill="#64748B" font-family="Consolas, monospace" font-size="12">automation</text>

    <rect x="1082" y="322" width="96" height="18" rx="9" fill="#152234"/>
    <rect x="1082" y="322" width="72" height="18" rx="9" fill="#A78BFA"/>
    <text x="1082" y="314" fill="#64748B" font-family="Consolas, monospace" font-size="12">support</text>

    <text x="814" y="150" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">TovieIT control room</text>
    <text x="814" y="174" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">One person, full-stack delivery, direct support,</text>
    <text x="814" y="196" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15">and absolutely no mystery hand-off department.</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" stroke="#1E293B"/>
