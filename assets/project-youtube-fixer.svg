<svg width="600" height="180" viewBox="0 0 600 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">YoutubeFixer</title><desc id="desc">A public userscript that fixes YouTube fullscreen changes.</desc>
  <rect width="600" height="180" rx="7" fill="#111813"/><rect x="0" width="5" height="180" rx="2.5" fill="#90B582"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="25" y="31" fill="#6F806F" font-size="11">./open-source/userscript</text>
    <text x="25" y="68" fill="#E6ECE3" font-size="23" font-weight="700">YoutubeFixer</text>
    <text x="25" y="95" fill="#AAB6A8" font-size="14">YouTube moved the furniture again; this puts it back</text>
    <text x="25" y="132" fill="#78977B" font-size="12">[javascript]  [tampermonkey]  [browser-ux]</text>
    <text x="25" y="158" fill="#9BCF80" font-size="12">open_repository()  &#8599;</text>
    <rect x="506" y="22" width="62" height="62" rx="5" fill="#151F17" stroke="#354A39"/>
    <text x="537" y="54" fill="#9BCF80" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">&#9654;</text>
  </g><rect x="0.75" y="0.75" width="598.5" height="178.5" rx="6.25" stroke="#2B3B2E" stroke-width="1.5"/>
</svg>

