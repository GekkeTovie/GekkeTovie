<svg width="600" height="180" viewBox="0 0 600 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">YoutubeFixer</title><desc id="desc">A public userscript that fixes YouTube fullscreen changes.</desc>
  <style>
    .accent { transform-origin: top; animation: grow 1s ease-out both; }
    .line { opacity: 0; animation: line-in .55s ease-out forwards; }
    .d1 { animation-delay: .16s; } .d2 { animation-delay: .29s; } .d3 { animation-delay: .42s; } .d4 { animation-delay: .55s; } .d5 { animation-delay: .68s; }
    .icon { transform-box: fill-box; transform-origin: center; animation: icon-in .65s .39s ease-out both, icon-pulse 4s 1.3s ease-in-out infinite; }
    .trace { stroke-dasharray: 84 980; animation: trace 5.4s linear infinite; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes line-in { from { opacity: 0; transform: translateX(-7px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes icon-in { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: scale(1); } }
    @keyframes icon-pulse { 0%, 100% { opacity: .78; } 50% { opacity: 1; } }
    @keyframes trace { to { stroke-dashoffset: -1064; } }
    @media (prefers-reduced-motion: reduce) { .accent, .line, .icon, .trace { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <rect width="600" height="180" rx="7" fill="#111813"/><rect class="accent" x="0" width="5" height="180" rx="2.5" fill="#90B582"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text class="line d1" x="25" y="31" fill="#6F806F" font-size="11">./open-source/userscript</text>
    <text class="line d2" x="25" y="68" fill="#E6ECE3" font-size="23" font-weight="700">YoutubeFixer</text>
    <text class="line d3" x="25" y="95" fill="#AAB6A8" font-size="14">YouTube moved the furniture again; this puts it back</text>
    <text class="line d4" x="25" y="132" fill="#78977B" font-size="12">[javascript]  [tampermonkey]  [browser-ux]</text>
    <text class="line d5" x="25" y="158" fill="#9BCF80" font-size="12">open_repository()  &#8599;</text>
    <g class="icon"><rect x="506" y="22" width="62" height="62" rx="5" fill="#151F17" stroke="#354A39"/><text x="537" y="54" fill="#9BCF80" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">&#9654;</text></g>
  </g><rect x="0.75" y="0.75" width="598.5" height="178.5" rx="6.25" stroke="#2B3B2E" stroke-width="1.5"/><rect class="trace" x="0.75" y="0.75" width="598.5" height="178.5" rx="6.25" stroke="#90B582" stroke-width="1.5"/>
</svg>

